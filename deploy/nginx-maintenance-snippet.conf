# ── 점검 모드용 Nginx 스니펫 ─────────────────────────────────────────
# 기존 server 블록(도메인/SSL 설정)은 그대로 두고, location / 부분만
# 아래처럼 바꿔서 쓰면 됩니다. 평소엔 그대로 Next.js로 프록시하다가,
# /var/www/hypepig/maintenance.flag 파일이 있으면 점검 페이지를 보여줍니다.
#
# 설치 방법:
#   1) 서버에 `mkdir -p /var/www/hypepig`
#   2) 이 레포의 deploy/maintenance.html을 서버의 /var/www/hypepig/maintenance.html로 복사
#   3) 기존 nginx site 설정(/etc/nginx/sites-available/hypepig 등)의
#      location / { ... } 블록을 아래 내용으로 교체
#   4) nginx -t 로 문법 확인 후 systemctl reload nginx

server {
    # ... 기존 server_name, listen 443 ssl, ssl_certificate 등은 그대로 유지 ...

    root /var/www/hypepig;

    error_page 503 @maintenance;
    location @maintenance {
        rewrite ^(.*)$ /maintenance.html break;
    }

    location / {
        # 점검 모드 플래그 파일이 있으면 503 + 점검 페이지로 응답
        if (-f /var/www/hypepig/maintenance.flag) {
            return 503;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
